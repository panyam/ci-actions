name: go-build-cache
description: >
  Restores Go's build cache from the newest earlier run of the same job, and saves it again from the
  default branch only, so packages that did not change compile from cache on every branch.

inputs:
  key:
    description: >
      Names the job's builds, such as browser or test. Jobs that build different packages should
      use different keys, so one job's cache does not crowd out another's.
    default: default
  save:
    description: >
      auto saves from the default branch only. true always saves and false never does. A pull
      request reads the default branch's caches, so saving from it too only adds entries.
    default: auto

outputs:
  matched-key:
    description: The cache entry restored, or empty when nothing matched. Set only when the run does not save.
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - id: info
      shell: bash
      env:
        SAVE: ${{ inputs.save }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        KEY: ${{ inputs.key }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        if ! command -v go >/dev/null; then echo "go-build-cache needs Go on PATH; run setup-go first"; exit 1; fi
        case "$SAVE" in
          auto) [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] && save=true || save=false ;;
          true|false) save=$SAVE ;;
          *) echo "save must be auto, true or false, not $SAVE"; exit 1 ;;
        esac
        prefix="go-build-$KEY-$RUNNER_OS-$RUNNER_ARCH-$(go env GOVERSION)-"
        {
          echo "path=$(go env GOCACHE)"
          echo "prefix=$prefix"
          echo "save=$save"
        } >> "$GITHUB_OUTPUT"
        echo "Go build cache $(go env GOCACHE), entries $prefix*, saving: $save"

    # actions/cache restores now and saves in its post step, once the job's builds have run. The run
    # id makes each save a new entry, and restore-keys picks the newest one with this prefix.
    - if: steps.info.outputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.info.outputs.path }}
        key: ${{ steps.info.outputs.prefix }}${{ github.run_id }}
        restore-keys: ${{ steps.info.outputs.prefix }}

    - id: restore
      if: steps.info.outputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.info.outputs.path }}
        key: ${{ steps.info.outputs.prefix }}${{ github.run_id }}
        restore-keys: ${{ steps.info.outputs.prefix }}
