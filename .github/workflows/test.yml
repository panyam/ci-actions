name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  setup-browser:
    name: setup-browser (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [runner-chrome, download]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install playwright-core
        working-directory: test
        run: npm install --no-audit --no-fund

      - id: browser
        uses: ./setup-browser
        with:
          working-directory: test
          force-download: ${{ matrix.mode == 'download' }}

      - name: Check which browser was chosen
        env:
          MODE: ${{ matrix.mode }}
          CHOSEN: ${{ steps.browser.outputs.chrome-path }}
        run: |
          if [ "$MODE" = runner-chrome ] && [ -z "$CHOSEN" ]; then echo "the runner has no Chrome"; exit 1; fi
          if [ "$MODE" = download ] && [ -n "$CHOSEN" ]; then echo "force-download still chose $CHOSEN"; exit 1; fi

      - name: Launch it
        working-directory: test
        run: node launch.mjs

  vulncheck-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test the issue reporter
        run: node --test test/vulncheck/report.test.mjs

  vulncheck-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./vulncheck
        with:
          working-directory: test/vulncheck/clean
          go-version-file: test/vulncheck/clean/go.mod
          cache-dependency-path: test/vulncheck/clean/go.sum

  # A failing scan has to fail the job. report is false, so nothing gets filed in this repo.
  vulncheck-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: scan
        continue-on-error: true
        uses: ./vulncheck
        with:
          command: exit 3
          report: "false"
          working-directory: test/vulncheck/clean
          go-version-file: test/vulncheck/clean/go.mod
          cache-dependency-path: test/vulncheck/clean/go.sum

      - name: Check the scan failed the step
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then echo "a scan that exited 3 left the step at $OUTCOME"; exit 1; fi

  setup-go-pnpm:
    name: setup-go-pnpm (${{ matrix.pnpm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pnpm: explicit
            dir: test/go-pnpm/web-explicit
            version: "12"
          - pnpm: packageManager
            dir: test/go-pnpm/web-pinned
            version: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./setup-go-pnpm
        with:
          go-version-file: test/go-pnpm/go.mod
          go-cache-dependency-path: test/go-pnpm/go.sum
          pnpm-version: ${{ matrix.version }}
          working-directory: ${{ matrix.dir }}

      - name: Go builds
        working-directory: test/go-pnpm
        run: go build -o /dev/null . && go version | grep -q go1.27

      - name: The pnpm project is installed
        working-directory: ${{ matrix.dir }}
        run: node -e "if (!require('is-number')(5)) process.exit(1)"

      - name: pnpm is the version asked for
        env:
          MODE: ${{ matrix.pnpm }}
        run: |
          v="$(pnpm --version)"
          echo "pnpm $v"
          case "$MODE" in
            explicit) [[ "$v" == 12.* ]] ;;
            packageManager) [ "$v" = 12.11.2 ] ;;
          esac

  # The publish workflow end to end, publishing with --dry-run. The fixtures aren't on npm, so the
  # job gets past the already-published check to the publish step.
  npm-publish:
    name: npm-publish (${{ matrix.package-manager }})
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      working-directory: test/npm-publish/${{ matrix.package-manager }}
      package-manager: ${{ matrix.package-manager }}
      tag: v0.0.0
      dry-run: true
      test-command: node -e "if (require('./index.js') !== 1) process.exit(1)"

  # One job builds and saves under a key unique to this run, and the next restores it. The second
  # job does not save, so it reports the entry it restored.
  go-build-cache-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: test/go-pnpm/go.mod
          cache: false

      - uses: ./go-build-cache
        with:
          key: test-${{ github.run_id }}-${{ github.run_attempt }}
          save: "true"

      - name: Build
        working-directory: test/go-pnpm
        run: go build -o /dev/null .

  go-build-cache-restore:
    needs: go-build-cache-save
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: test/go-pnpm/go.mod
          cache: false

      - id: cache
        uses: ./go-build-cache
        with:
          key: test-${{ github.run_id }}-${{ github.run_attempt }}
          save: "false"

      - name: Check the saved cache came back
        env:
          MATCHED: ${{ steps.cache.outputs.matched-key }}
          WANT: go-build-test-${{ github.run_id }}-${{ github.run_attempt }}-
        run: |
          echo "restored: $MATCHED"
          case "$MATCHED" in "$WANT"*) ;; *) echo "want an entry starting $WANT"; exit 1 ;; esac
          n=$(find "$(go env GOCACHE)" -type f | wc -l)
          echo "$n files in the build cache"
          [ "$n" -gt 100 ]

  helm-oci-publish-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: chart
        uses: ./helm-oci-publish
        with:
          chart: test/helm/sample
          version: v1.2.3
          push: "false"

      - name: Check the package carries the release's version
        env:
          PKG: ${{ steps.chart.outputs.package }}
          REF: ${{ steps.chart.outputs.ref }}
        run: |
          [ "$(basename "$PKG")" = sample-1.2.3.tgz ] || { echo "packaged $PKG"; exit 1; }
          [ -z "$REF" ] || { echo "push: false still pushed $REF"; exit 1; }
          tar -xzOf "$PKG" sample/Chart.yaml | tee /dev/stderr | grep -qx 'version: 1.2.3'
          tar -xzOf "$PKG" sample/Chart.yaml | grep -Eqx 'appVersion: "?v1.2.3"?'

  helm-oci-publish-push:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: chart
        uses: ./helm-oci-publish
        with:
          chart: test/helm/sample
          version: 1.2.3
          registry: oci://localhost:5000/charts
          login: "false"
          plain-http: "true"

      - name: Check the outputs name what the registry holds
        env:
          REF: ${{ steps.chart.outputs.ref }}
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          echo "ref $REF, digest $DIGEST"
          [ "$REF" = localhost:5000/charts/sample:1.2.3 ]
          echo "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'
          helm show chart oci://localhost:5000/charts/sample --version 1.2.3 --plain-http | grep -qx 'version: 1.2.3'

  kind-ingress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build an image only this runner has
        run: docker build -t ci-actions-test/hello:dev test/kind

      - id: kind
        uses: ./kind-ingress
        with:
          images: ci-actions-test/hello:dev

      - name: Install a one-pod chart behind an Ingress
        run: helm install hello test/kind/chart --wait --timeout 120s

      - name: Curl it through the mapped port
        run: |
          for _ in $(seq 1 30); do
            out=$(curl -fsS http://localhost/ 2>&1 || true)
            [ "$out" = 'hello from kind-ingress' ] && exit 0
            sleep 2
          done
          echo "got: $out"
          exit 1

      - name: A pod reaches a process on the runner at the gateway
        env:
          GATEWAY: ${{ steps.kind.outputs.gateway }}
        run: |
          echo "gateway $GATEWAY"
          mkdir -p "$RUNNER_TEMP/gw"
          echo 'hello from the runner' >"$RUNNER_TEMP/gw/marker.txt"
          python3 -m http.server 8999 --bind "$GATEWAY" --directory "$RUNNER_TEMP/gw" >/dev/null 2>&1 &
          sleep 1
          out=$(kubectl run probe --image=ci-actions-test/hello:dev --image-pull-policy=Never --restart=Never \
            --rm -i --quiet --command -- wget -qO- "http://$GATEWAY:8999/marker.txt")
          [ "$out" = 'hello from the runner' ] || { echo "got: $out"; exit 1; }

  compose-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: up
        uses: ./compose-up
        with:
          file: test/compose/compose.yaml
          env-file: test/compose/test.env
          wait-url: http://127.0.0.1:18081/

      - name: Check it answers on the env file's port
        run: '[ "$(curl -fsS http://127.0.0.1:18081/)" = "hello from compose-up" ]'

      # The real post step runs again at the job's end, on a project that's already gone.
      - name: Tear down as the post step does
        env:
          PROJECT: ${{ steps.up.outputs.project }}
          STATE_args: '["compose","-p","${{ steps.up.outputs.project }}","-f","test/compose/compose.yaml","--env-file","test/compose/test.env"]'
        run: |
          docker volume ls -q --filter "label=com.docker.compose.project=$PROJECT" | grep -q . || { echo "no volume to remove"; exit 1; }
          node compose-up/post.js
          if docker compose ls -a -q | grep -qx "$PROJECT"; then echo "$PROJECT is still up"; exit 1; fi
          if docker volume ls -q --filter "label=com.docker.compose.project=$PROJECT" | grep -q .; then echo "down -v left a volume"; exit 1; fi

  compose-up-timeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: up
        continue-on-error: true
        uses: ./compose-up
        with:
          file: test/compose/compose.yaml
          wait-url: http://127.0.0.1:18089/
          wait-timeout: "5"

      - name: Check a URL that never answers fails the step
        env:
          OUTCOME: ${{ steps.up.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then echo "a dead wait-url left the step at $OUTCOME"; exit 1; fi
