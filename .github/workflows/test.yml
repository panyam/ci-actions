name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  setup-browser:
    name: setup-browser (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [runner-chrome, download]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install playwright-core
        working-directory: test
        run: npm install --no-audit --no-fund

      - id: browser
        uses: ./setup-browser
        with:
          working-directory: test
          force-download: ${{ matrix.mode == 'download' }}

      - name: Check which browser was chosen
        env:
          MODE: ${{ matrix.mode }}
          CHOSEN: ${{ steps.browser.outputs.chrome-path }}
        run: |
          if [ "$MODE" = runner-chrome ] && [ -z "$CHOSEN" ]; then echo "the runner has no Chrome"; exit 1; fi
          if [ "$MODE" = download ] && [ -n "$CHOSEN" ]; then echo "force-download still chose $CHOSEN"; exit 1; fi

      - name: Launch it
        working-directory: test
        run: node launch.mjs

  # The publish workflow end to end, publishing with --dry-run. The fixtures aren't on npm, so the
  # job gets past the already-published check to the publish step.
  npm-publish:
    name: npm-publish (${{ matrix.package-manager }})
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      working-directory: test/npm-publish/${{ matrix.package-manager }}
      package-manager: ${{ matrix.package-manager }}
      tag: v0.0.0
      dry-run: true
      test-command: node -e "if (require('./index.js') !== 1) process.exit(1)"
